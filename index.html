<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Poké Quest</title><style>

8px)}}.dn{position:absolute;font-weight:700;font-size:clamp(14px,3vw,26px);color:#fff;text-shadow:0 0 3px #2d2a26,0 0 3px #2d2a26;animation:up 1s forwards}@keyframes up{to{transform:translateY(-30px);opacity:0}}

.pad{position:absolute;width:34%;height:12%;background:#8aa078;border-radius:50%}
.sc{position:absolute;width:26%;animation:bob 2s infinite ease-in-out}.sc.ko{opacity:0;transform:translateY(30px);transition:.6s;animation:none}
@keyframes bob{50%{transform:translateY(-4px)}}
.info{position:absolute;background:#f3eddc;color:#2d2a26;border:3px solid #2d2a26;border-radius:8px;padding:4px 8px;width:42%;font-size:clamp(10px,1.8vw,15px)}
.hp{height:8px;background:#5a5a5a;border-radius:4px;overflow:hidden;margin:3px 0}.hp i{display:block;height:100%;background:#6f9a6a;transition:width .5s}
#log{min-height:3.4em}#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),app=$('#app'),wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=a=>a[Math.random()*a.length|0],sh=a=>[...a].sort(()=>Math.random()-.5),cap=s=>s[0].toUpperCase()+s.slice(1);

function setup(){app.innerHTML=`<div class=panel><h2 style="margin:0 0 8px">Poké Quest</h2><b>1. Choose region</b><div class=grid style="margin:6px 0 12px">${Object.keys(REG).map(k=>`<div class="card ${k==SU.r?'sel':''}" data-a=reg data-v=${k}><b>${k}</b></div>`).join('')}</div><b>2. Pick up to 6 Pokémon (${SU.p.length}/6) — ★ can Mega Evolve</b><div class=grid style="margin:6px 0 12px">${R.map((r,i)=>`<div class="card ${SU.p.includes(i)?'sel':''}" data-a=pk data-v=${i}>${spr({i})}<div>${r.n}${r.m?' ★':''}</div>${r.t.map(chip).join('')}</div>`).join('')}</div>${(()=>{try{return localStorage.getItem('pq')}catch{}})()?'<button data-a=load>Continue saved game</button> ':''}<button data-a=go ${SU.p.length?'':'disabled'}>New Adventure</button> <small>Unlimited Rare Candies &amp; cash included.</small></div>`}

let AC,mn=0,mi,mus=0;const tone=(f,d=.12,ty='square',v=.04,t0=0)=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g).connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d)}catch{}};

const K={};document.addEventListener('pointerdown',e=>{const k=e.target.closest?.('[data-k]')?.dataset.k;if(k){K[k]=1;e.preventDefault()}});['pointerup','pointercancel'].forEach(v=>document.addEventListener(v,()=>{K.w=K.a=K.s=K.d=0}));

onkeydown=e=>{K[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>K[e.key.toLowerCase()]=0;onblur=()=>{for(const q in K)K[q]=0};
const BX=[...Array(8)].map((_,i)=>[GL[i%4],i<4?5:71,14,24]).concat([[2,33,14,24],[84,33,14,24],[46,36,12,13]]);
const DR=[...Array(8)].map((_,i)=>[GL[i%4]+7,i<4?29:71,i<4?-1:1,()=>A.gym(i)]).concat([[9,57,-1,()=>A.store()],[91,57,-1,()=>A.lg()]]);
let LP,lt=0;
function tick(t){const m=$('#me');if(!m)return;LP=requestAnimationFrame(tick);const dt=Math.min(.05,(t-lt)/1e3||0);lt=t;if(S.mv)return;
const dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);
if(!dx&&!dy){m.classList.remove('wk');return}
m.classList.add('wk');m.style.transition='none';const n=Math.hypot(dx,dy);let[x,y]=S.pos;
const hit=(a,b)=>BX.some(([l,u,w,h])=>a>l-1&&a<l+w+1&&b>u&&b<u+h);
const mp=$('#map'),vy=26*mp.clientWidth/mp.clientHeight,nx=Math.min(97,Math.max(3,x+dx/n*26*dt)),ny=Math.min(95,Math.max(4,y+dy/n*vy*dt));
if(!hit(nx,y))x=nx;if(!hit(x,ny))y=ny;S.pos=[x,y];m.style.left=x+'%';m.style.top=y+'%';if(GZ.some(([a,b,w,h])=>x>a&&x<a+w&&y>b&&y<b+h)&&Math.random()<dt*.3){m.classList.remove('wk');tone(300,.1);wild();return}
const d=DR.find(([a,b,r])=>Math.abs(x-a)<3&&Math.abs(y-b)<2&&dy==r);if(d&&t>(S.cd||0)){S.cd=t+1500;S.q=1;d[3]();S.q=0}}
/* battle */
const pc=()=>S.p[B.pi],fc=()=>B.foe.team[B.fi],menu=h=>$('#menu').innerHTML=h,say=t=>$('#log').textContent=t;
function startBattle(foe,done){S.p.forEach(m=>m.mega=false);B={foe,fi:0,done,busy:0,mega:0,pi:S.p.findIndex(m=>m.hp>0)};if(B.pi<0){toast('Heal your party first!');return map()}
app.innerHTML=`<div id=bt class=in></div><div class=panel id=log></div><div class=panel id=menu></div>`;{const bt=$('#bt'),c=TC[foe.t]||'#7a7a7a';bt.style.setProperty('--gr',foe.lg?'#5a5468':`color-mix(in srgb,${c} 28%,#cfc9b4)`);bt.style.setProperty('--sky',foe.lg?'#7a7488':`color-mix(in srgb,${c} 14%,#d6dcdc)`)}B.intro=!foe.wild;rb();say(foe.wild?`A wild ${ST(foe.team[0]).n} appeared!`:`${foe.n} wants to battle and sends out ${ST(foe.team[0]).n}!`);main();const b0=B;setTimeout(()=>{if(B===b0){B.intro=0;rb()}},1400)}
function rb(){const p=pc(),f=fc();S.dex[f.i]=S.dex[f.i]||1;const ps=ST(p),fs=ST(f),inf=(m,s,me,c)=>`<div class=info style="${c}"><b>${s.n}</b> Lv${m.L}${m.st?` <span class=chip style="background:#6f5d8f">${m.st}</span>`:''}<div>${s.t.map(chip).join('')}</div><div class=hp><i style="width:${m.hp/s.mhp*100}%"></i></div>${me?`<small>${m.hp}/${s.mhp}</small>`:''}</div>`;
$('#bt').innerHTML=`<div class=ring></div><div class=pad style="left:56%;top:36%"></div><div class=pad style="left:4%;top:78%"></div><div id=sf class="sc ${f.hp<=0||B.hide||B.intro?'ko':''}" style="left:64%;top:10%">${spr(f)}</div><div id=sp class="sc ${p.hp<=0||B.intro?'ko':''}" style="left:12%;top:48%;width:30%">${spr(p)}</div>`+inf(f,fs,0,'left:4%;top:6%')+inf(p,ps,1,'right:4%;top:62%')+(B.intro?`<div class=tn style="left:72%;top:14%;--c:${TC[B.foe.t]||'#777'}"></div>${B.foe.s?`<img class=ti src="sprites/trainers/${B.foe.s.toLowerCase().replace(/[^a-z]/g,'')}.png" style="left:66%;top:4%" alt="" onload="this.previousElementSibling.style.visibility='hidden'" onerror="this.remove()">`:''}<div class=tn style="left:20%;top:50%;--c:#5b7a8c"></div>`:'')}
function main(){B.busy=0;menu(`<button data-a=fight>Fight</button><button data-a=bagb>Bag</button><button data-a=swb>Pokémon</button>${B.foe.wild?'<button data-a=run>Run</button>':''}`)}
A.main=main;
A.fight=()=>{const p=pc(),r=R[p.i];menu(MV(r).map((m,i)=>`<button data-a=mv data-v=${i} style="border-color:${TC[m.t]}">${m.n}<br><small>${m.t} · ${m.p}</small></button>`).join('')+(p.mega?'<button disabled>★ Mega active</button>':r.m&&!B.mega?'<button data-a=mega style="background:#e7d994">★ Mega Evolve</button>':'')+'<button data-a=main>Back</button>')};
A.mega=()=>{const p=pc();p.mega=true;B.mega=1;rb();say(`${R[p.i].n} Mega Evolved into ${ST(p).n}!`);A.fight()};
A.mv=i=>turn({mv:+i});
A.bagb=()=>menu(IT.map(([n])=>`<button data-a=use data-v="${n}" ${S.bag[n]?'':'disabled'}>${n} ×${S.bag[n]}</button>`).join('')+'<button data-a=main>Back</button>');

A.swb=()=>menu(S.p.map((m,i)=>`<button data-a=sw data-v=${i} ${m.hp<=0||i==B.pi?'disabled':''}>${ST(m).n} Lv${m.L}<br><small>${m.hp}/${ST(m).mhp}</small></button>`).join('')+'<button data-a=main>Back</button>');
A.sw=i=>turn({sw:+i});

const ai=(f,p)=>sh(MV(R[f.i])).map(m=>[m,m.p*eff(m.t,ST(p).t)*(ST(f).t.includes(m.t)?1.5:1)]).sort((a,b)=>b[1]-a[1])[0][0];
function dmg(a,d,m){const A_=ST(a),D=ST(d),e=eff(m.t,D.t),x=((2*a.L/5+2)*m.p*A_.a*(a.st=='brn'?.6:1)/D.d/50+2)*(A_.t.includes(m.t)?1.5:1)*e*(.85+Math.random()*.15)*.75;return{d:e?Math.max(1,Math.floor(x)):0,e}}
async function hit(at,df,m){const n=ST(at).n;if(at.st=='slp'){if(Math.random()<.35){at.st=0;rb()}else{say(`${n} is fast asleep!`);await wait(900);return}}if(at.st=='par'&&Math.random()<.25){say(`${n} is paralyzed! It can't move!`);await wait(900);return}say(`${n} used ${m.n}!`);const ap=at===pc();$('#'+(ap?'sp':'sf'))?.classList.add(ap?'lgp':'lgf');await wait(450);const r=dmg(at,df,m);df.hp=Math.max(0,df.hp-r.d);rb();$('#'+(ap?'sf':'sp'))?.classList.add('hr');tone(r.e>1?220:r.e<1?90:150,.15,'sawtooth');if(r.d&&!df.st&&df.hp>0&&STX[m.t]&&Math.random()<.22){df.st=STX[m.t];rb()}if(r.d){const e=document.createElement('div');e.className='dn';e.textContent='-'+r.d;e.style.cssText=`left:${ap?70:20}%;top:${ap?10:44}%`;$('#bt').append(e)}say(r.e==0?"It had no effect...":r.e>1?"It's super effective!":r.e<1?"It's not very effective...":`${n} dealt ${r.d} damage.`);await wait(900);if(at.hp>0&&(at.st=='brn'||at.st=='psn')){at.hp=Math.max(1,at.hp-Math.max(1,ST(at).mhp>>4));rb();say(`${n} is hurt by its ${at.st=='brn'?'burn':'poison'}!`);await wait(800)}}
async function turn(a){if(B.busy)return;B.busy=1;menu('');const p=pc();let pm;
if(a.sw!=null){B.pi=a.sw;rb();say(`Go, ${ST(pc()).n}!`);await wait(800)}
else if(a.item){const it=IT.find(x=>x[0]==a.item);S.bag[a.item]--;if(a.item=='Poké Ball'){if(!B.foe.wild){S.bag[a.item]++;say("You can't catch a trainer's Pokémon!");await wait(900);return main()}const f=fc(),ok=Math.random()<.25+.6*(1-f.hp/ST(f).mhp);say('You threw a Poké Ball!');await wait(900);if(ok){say(`Gotcha! ${ST(f).n} was caught!`);S.p.push(f);S.dex[f.i]=2;[523,659,784].forEach((q,i)=>tone(q,.2,'square',.04,i*.15));menu('<button data-a=done>Continue</button>');return}say('Oh no! It broke free!')}else if(a.item=='Revive'){const m=S.p.find(m=>m.hp<=0);if(!m){S.bag[a.item]++;say('No fainted Pokémon!');await wait(900);return main()}m.hp=Math.floor(ST(m).mhp/2);say(`${ST(m).n} was revived!`)}else{p.hp=Math.min(ST(p).mhp,p.hp+it[1]);say(`${ST(p).n} recovered HP!`)}rb();await wait(900)}

for(const s of sides){const at=s=='p'?pc():fc(),df=s=='p'?fc():pc();if(at.hp<=0)continue;await hit(at,df,s=='p'?pm:ai(at,df));if(df.hp<=0){if(await faint(s=='p'?'f':'p'))return;break}}
